---
# -- Name for this Blackbox prober instance.
# @section -- General Settings
name: ""

# -- The value of the job label for scraped metrics
# @section -- General Settings
jobLabel: integration/blackbox

# Settings for metrics collection
metrics:
  # -- Whether to enable metrics collection from Blackbox prober.
  # @section -- Metrics Settings
  enabled: true

  # -- How frequently to scrape metrics.
  # @default -- `60s`
  # @section -- Scrape Settings
  scrapeInterval:

  # -- Sets the max_cache_size for prometheus.relabel component.
  # This should be at least 2x-5x your largest scrape target or samples appended rate.
  # ([docs](https://grafana.com/docs/alloy/latest/reference/components/prometheus.relabel/#arguments))
  # Overrides global.maxCacheSize
  # @default -- `100000`
  # @section -- Metric Processing Settings
  maxCacheSize:

  # Adjustments to the scraped metrics to filter the amount of data sent to storage.
  tuning:
    # -- Metrics to keep. Can use regular expressions.
    # @section -- Metric Processing Settings
    includeMetrics: []
    # -- Metrics to drop. Can use regular expressions.
    # @section -- Metric Processing Settings
    excludeMetrics: []

# Settings for the Alloy embedded Blackbox prober Exporter
exporter:
  # -- Blackbox configuration.
  # @section -- Exporter Settings
  config: |
    modules:
      http_2xx:
        prober: http
        timeout: 5s
        http:
          valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
          valid_status_codes: []
          method: GET
  
  # -- Targets to probe.
  # @section -- Exporter Settings
  targets: []
  
  # -- Module to use for probing.
  # @default -- `http_2xx`
  # @section -- Exporter Settings
  module: "http_2xx"

# Settings for automatic HTTPRoute discovery
discovery:
  # -- Enable automatic discovery of HTTPRoute resources
  # @section -- Discovery Settings
  enabled: false
  
  # -- The namespaces to look for HTTPRoute resources.
  # An empty list means all namespaces will be searched
  # @section -- Discovery Settings
  namespaces: []
  
  # -- Label selectors to filter HTTPRoute resources
  # @section -- Discovery Settings
  labelSelectors: {}
  
  # -- Module to use for discovered HTTPRoute targets
  # @default -- `http_2xx`
  # @section -- Discovery Settings
  module: "http_2xx"
  
  # -- Protocol to use for discovered routes (http or https)
  # @default -- `https`
  # @section -- Discovery Settings
  protocol: "https"
  
  # -- Additional path to append to discovered routes
  # @section -- Discovery Settings
  path: ""
  
  # -- Additional relabel rules to apply to discovered targets
  # @section -- Discovery Settings
  extraRelabelRules: []
