# Example values file showing how to use the new Prometheus exporter integrations
# This demonstrates various patterns for configuring different exporters

# PostgreSQL monitoring
postgres:
  instances:
    - name: main-postgres
      exporter:
        address: postgres.database.svc.cluster.local:5432
        auth:
          username: monitoring
          password: monitoring-password
      metrics:
        scrapeInterval: 30s
        tuning:
          includeMetrics:
            - pg_database_.*
            - pg_stat_.*

# Redis monitoring
redis:
  instances:
    - name: cache-redis
      exporter:
        address: redis.cache.svc.cluster.local:6379
        auth:
          password: redis-password
      metrics:
        tuning:
          excludeMetrics:
            - redis_commands_duration_seconds_total

# Elasticsearch monitoring
elasticsearch:
  instances:
    - name: search-cluster
      exporter:
        address: http://elasticsearch.search.svc.cluster.local:9200
        auth:
          username: elastic
          password: elastic-password
      metrics:
        scrapeInterval: 60s

# MongoDB monitoring with URI
mongodb:
  instances:
    - name: app-mongodb
      exporter:
        uri: "mongodb://mongouser:mongopass@mongodb.app.svc.cluster.local:27017/admin"
      metrics:
        tuning:
          includeMetrics:
            - mongodb_mongod_.*
            - mongodb_op_counters_.*

# Blackbox monitoring for endpoint probing
blackbox:
  instances:
    - name: external-endpoints
      exporter:
        targets:
          - https://api.example.com/health
          - https://app.example.com
          - tcp://database.example.com:5432
        module: http_2xx
        config: |
          modules:
            http_2xx:
              prober: http
              timeout: 5s
              http:
                valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
                valid_status_codes: [200, 204]
                method: GET
            tcp_connect:
              prober: tcp
              timeout: 5s
    
    # HTTPRoute auto-discovery example
    - name: httproute-monitor
      exporter:
        config: |
          modules:
            http_2xx:
              prober: http
              timeout: 5s
              http:
                valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
                method: GET
      discovery:
        enabled: true
        namespaces:
          - production
        labelSelectors:
          gateway: public
        protocol: https
        path: /health
        module: http_2xx

# Apache monitoring
apache:
  instances:
    - name: web-servers
      exporter:
        scrapeURI: "http://apache.web.svc.cluster.local/server-status?auto"
      metrics:
        scrapeInterval: 30s

# Kafka monitoring
kafka:
  instances:
    - name: event-bus
      exporter:
        address: kafka.messaging.svc.cluster.local:9092
        auth:
          username: kafka-user
          password: kafka-password
      metrics:
        tuning:
          includeMetrics:
            - kafka_topic_.*
            - kafka_consumer_.*

# SNMP monitoring for network devices
snmp:
  instances:
    - name: network-switches
      exporter:
        targets:
          - 192.168.1.1  # Core switch
          - 192.168.1.2  # Distribution switch
        config: |
          auths:
            public:
              community: public
              security_level: noAuthNoPriv
              auth_protocol: MD5
              priv_protocol: DES
          
          modules:
            if_mib:
              walk:
                - 1.3.6.1.2.1.2
                - 1.3.6.1.2.1.31.1.1
              metrics:
                - name: sysUpTime
                  oid: 1.3.6.1.2.1.1.3
                  type: gauge
                  help: The time (in hundredths of a second) since the network management portion of the system was last re-initialized.

# Consul monitoring
consul:
  instances:
    - name: service-discovery
      exporter:
        server: "http://consul.system.svc.cluster.local:8500"
        datacenter: "dc1"
        allowStale: true
      metrics:
        scrapeInterval: 30s

# Memcached monitoring
memcached:
  instances:
    - name: session-cache
      exporter:
        address: memcached.cache.svc.cluster.local:11211
      metrics:
        tuning:
          includeMetrics:
            - memcached_up
            - memcached_current_.*
            - memcached_items_.*

# StatsD monitoring
statsd:
  instances:
    - name: metrics-aggregator
      exporter:
        listenAddress: "0.0.0.0:9125"
        mappingConfig: |
          mappings:
          - match: "api.*.request.count"
            name: "api_requests_total"
            labels:
              endpoint: "$1"
          - match: "api.*.request.duration"
            name: "api_request_duration_seconds"
            timer_type: histogram
            labels:
              endpoint: "$1"